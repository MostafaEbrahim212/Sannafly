name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-sqlite:
    name: Tests (PHP ${{ matrix.php }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, gd, bcmath
          coverage: pcov

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install NPM dependencies
        run: npm ci

      - name: Laravel Pint
        run: composer run lint

      - name: Larastan
        run: composer run analyse

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

      - name: Build Vite assets
        run: npm run build

      - name: Prepare SQLite database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run Pest tests with coverage
        run: composer run test:coverage

      - name: Run Pest 3x in random order (flake check)
        if: matrix.php == '8.4' && matrix.node == '22'
        run: |
          php artisan test --order-by=random
          php artisan test --order-by=random
          php artisan test --order-by=random

      - name: Install Playwright browsers & run E2E
        if: matrix.php == '8.4' && matrix.node == '22'
        run: |
          php artisan migrate:fresh --seed --force
          npx playwright install chromium
          npx playwright test

      - name: Upload coverage artifact
        if: always() && matrix.php == '8.4' && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-php-${{ matrix.php }}
          path: coverage/

  concurrency-mysql:
    name: MySQL 8 Concurrency Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: sannafly_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd, bcmath, pcntl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run MySQL concurrency tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sannafly_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan test --group=mysql
